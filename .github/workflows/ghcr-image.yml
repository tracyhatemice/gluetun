name: GHCR image
on:
  # Once CI has passed for a push to master, so only tested commits are
  # published.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [master]
  # By hand, on any branch. This does not wait for CI.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    if: |
      github.repository == 'tracyhatemice/gluetun' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
      )
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    env:
      # The commit CI tested. A workflow_run event's own commit is the latest
      # on master, which can be newer.
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Short commit
        id: shortcommit
        run: echo "value=${COMMIT_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=raw,value=sha-${{ steps.shortcommit.outputs.value }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          # The checked out commit, rather than the default Git context, which
          # is the event's own commit.
          context: .
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CREATED=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            COMMIT=${{ steps.shortcommit.outputs.value }}
            VERSION=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.version'] }}
          tags: ${{ steps.meta.outputs.tags }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
